<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Tracker - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            color: #667eea;
            font-size: 24px;
        }

        .user-info {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 20px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .duration-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .duration-input input {
            width: 80px;
        }

        .duration-input span {
            color: #666;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-full {
            width: 100%;
            margin-top: 10px;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .error-input {
            border-color: #dc3545 !important;
        }

        .optional {
            color: #999;
            font-size: 12px;
            font-weight: normal;
        }

        /* Rating Styles */
        .rating-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 28px;
            cursor: pointer;
        }

        .star {
            color: #ddd;
            transition: color 0.2s;
        }

        .star.active,
        .star:hover {
            color: #ffc107;
        }

        .star.active {
            animation: starPop 0.3s ease;
        }

        @keyframes starPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .rating-label {
            color: #666;
            font-size: 14px;
            min-width: 120px;
        }

        .session-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .session-rating .star {
            font-size: 16px;
            cursor: default;
        }

        /* Sessions List Styles */
        .sessions-list {
            margin-top: 20px;
        }

        .session-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .session-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .session-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .session-subject {
            color: #667eea;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .session-duration {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .session-date {
            color: #999;
            font-size: 12px;
        }

        .session-notes {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            font-style: italic;
        }

        .session-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #ffc107;
            color: #333;
        }

        .btn-edit:hover {
            background: #e0a800;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .modal-header h2 {
            margin: 0;
            border: none;
            padding: 0;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close:hover {
            color: #000;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #6c757d;
            flex: 1;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex: 1;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h1>📚 Productivity Tracker</h1>
    <div style="display: flex; align-items: center;">
        <span class="user-info" id="user-email">Welcome!</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <!-- Create Session Card -->
    <div class="card">
        <h2>Create Study Session</h2>

        <div class="form-group">
            <label for="sessionName">Session Name</label>
            <input type="text" id="sessionName" placeholder="e.g., Morning Study, Final Review">
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="e.g., Mathematics, Physics, Programming">
        </div>

        <div class="form-group">
            <label for="duration">Duration</label>
            <div class="duration-input">
                <input type="number" id="hours" placeholder="0" min="0" max="23">
                <span>hours</span>
                <input type="number" id="minutes" placeholder="0" min="0" max="59">
                <span>minutes</span>
            </div>
        </div>

        <div class="form-group">
            <label>Session Rating</label>
            <div class="rating-container">
                <div class="star-rating" id="starRating">
                    <span class="star" data-rating="1" onclick="setRating(1)">★</span>
                    <span class="star" data-rating="2" onclick="setRating(2)">★</span>
                    <span class="star" data-rating="3" onclick="setRating(3)">★</span>
                    <span class="star" data-rating="4" onclick="setRating(4)">★</span>
                    <span class="star" data-rating="5" onclick="setRating(5)">★</span>
                </div>
                <span class="rating-label" id="ratingLabel">Not rated</span>
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes <span class="optional">(Optional)</span></label>
            <textarea id="notes" placeholder="Add any notes about this study session..."></textarea>
        </div>

        <button class="btn-full" onclick="createSession()">Create Session</button>

        <div id="message" class="message"></div>
    </div>

    <!-- View Sessions Card -->
    <div class="card">
        <h2>My Study Sessions</h2>
        <div id="sessions-list" class="sessions-list">
            <div class="empty-state">
                <p>Loading sessions...</p>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Session</h2>
            <span class="close" onclick="closeEditModal()">&times;</span>
        </div>

        <div class="form-group">
            <label for="editSessionName">Session Name</label>
            <input type="text" id="editSessionName">
        </div>

        <div class="form-group">
            <label for="editSubject">Subject</label>
            <input type="text" id="editSubject">
        </div>

        <div class="form-group">
            <label for="editDuration">Duration</label>
            <div class="duration-input">
                <input type="number" id="editHours" min="0" max="23">
                <span>hours</span>
                <input type="number" id="editMinutes" min="0" max="59">
                <span>minutes</span>
            </div>
        </div>

        <div class="form-group">
            <label>Session Rating</label>
            <div class="rating-container">
                <div class="star-rating" id="editStarRating">
                    <span class="star" data-rating="1" onclick="setEditRating(1)">★</span>
                    <span class="star" data-rating="2" onclick="setEditRating(2)">★</span>
                    <span class="star" data-rating="3" onclick="setEditRating(3)">★</span>
                    <span class="star" data-rating="4" onclick="setEditRating(4)">★</span>
                    <span class="star" data-rating="5" onclick="setEditRating(5)">★</span>
                </div>
                <span class="rating-label" id="editRatingLabel">Not rated</span>
            </div>
        </div>

        <div class="form-group">
            <label for="editNotes">Notes <span class="optional">(Optional)</span></label>
            <textarea id="editNotes"></textarea>
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn-save" onclick="saveEdit()">Save Changes</button>
        </div>

        <div id="editMessage" class="message"></div>
    </div>
</div>

<script>
    const userEmail = sessionStorage.getItem('userEmail');
    let currentEditSessionId = null;
    let currentRating = 0;
    let currentEditRating = 0;

    if (!userEmail) {
        window.location.href = '/';
    } else {
        document.getElementById('user-email').textContent = `Welcome, ${userEmail}`;
        loadSessions();
    }

    function showMessage(text, isSuccess, elementId = 'message') {
        const message = document.getElementById(elementId);
        message.textContent = text;
        message.className = 'message ' + (isSuccess ? 'success' : 'error');
        message.style.display = 'block';
    }

    function clearErrors() {
        document.querySelectorAll('.error-input').forEach(input => {
            input.classList.remove('error-input');
        });
    }

    function highlightError(elementId) {
        document.getElementById(elementId).classList.add('error-input');
    }

    function formatDuration(minutes) {
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;

        if (hours > 0 && mins > 0) {
            return `${hours}h ${mins}m`;
        } else if (hours > 0) {
            return `${hours}h`;
        } else {
            return `${mins}m`;
        }
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function setRating(rating) {
        currentRating = rating;
        updateStarDisplay('starRating', 'ratingLabel', rating);
    }

    function setEditRating(rating) {
        currentEditRating = rating;
        updateStarDisplay('editStarRating', 'editRatingLabel', rating);
    }

    function updateStarDisplay(containerId, labelId, rating) {
        const container = document.getElementById(containerId);
        const stars = container.querySelectorAll('.star');
        const label = document.getElementById(labelId);

        stars.forEach((star, index) => {
            if (index < rating) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });

        const labels = ['Not rated', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
        label.textContent = labels[rating];
    }

    function displaySessionRating(rating) {
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            stars += `<span class="star ${i <= rating ? 'active' : ''}">★</span>`;
        }
        return `<div class="session-rating">${stars}</div>`;
    }

    async function loadSessions() {
        try {
            const response = await fetch(`/session/list?userEmail=${encodeURIComponent(userEmail)}`);
            const sessions = await response.json();

            const sessionsList = document.getElementById('sessions-list');

            if (sessions.length === 0) {
                sessionsList.innerHTML = `
                    <div class="empty-state">
                        <p>No study sessions yet. Create your first one above! 📝</p>
                    </div>
                `;
            } else {
                sessionsList.innerHTML = sessions.map(session => `
                    <div class="session-item">
                        <div class="session-header">
                            <div>
                                <div class="session-title">${session.sessionName}</div>
                                <div class="session-subject">📖 ${session.subject}</div>
                                <div class="session-duration">⏱️ ${formatDuration(session.duration)}</div>
                                ${displaySessionRating(session.rating)}
                                <div class="session-date">📅 ${formatDate(session.createdAt)}</div>
                                ${session.notes ? `<div class="session-notes">📝 ${session.notes}</div>` : ''}
                            </div>
                            <div class="session-actions">
                                <button class="btn-edit" onclick="openEditModal('${session.sessionId}')">Edit</button>
                                <button class="btn-delete" onclick="deleteSession('${session.sessionId}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        } catch (error) {
            console.error('Error loading sessions:', error);
            document.getElementById('sessions-list').innerHTML = `
                <div class="empty-state">
                    <p>Error loading sessions. Please refresh the page.</p>
                </div>
            `;
        }
    }

    async function createSession() {
        clearErrors();

        const sessionName = document.getElementById('sessionName').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const hours = parseInt(document.getElementById('hours').value) || 0;
        const minutes = parseInt(document.getElementById('minutes').value) || 0;
        const notes = document.getElementById('notes').value.trim();

        const duration = (hours * 60) + minutes;

        if (!sessionName) {
            showMessage('Please enter a session name', false);
            highlightError('sessionName');
            return;
        }

        if (!subject) {
            showMessage('Please enter a subject', false);
            highlightError('subject');
            return;
        }

        if (duration <= 0) {
            showMessage('Please enter a valid duration', false);
            highlightError('hours');
            highlightError('minutes');
            return;
        }

        if (duration > 1440) {
            showMessage('Duration cannot exceed 24 hours', false);
            highlightError('hours');
            highlightError('minutes');
            return;
        }

        if (currentRating === 0) {
            showMessage('Please rate this session', false);
            return;
        }

        try {
            const response = await fetch('/session/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userEmail: userEmail,
                    sessionName: sessionName,
                    subject: subject,
                    duration: duration,
                    rating: currentRating,
                    notes: notes
                })
            });

            const result = await response.text();

            if (result === 'Session created successfully') {
                showMessage(result, true);
                document.getElementById('sessionName').value = '';
                document.getElementById('subject').value = '';
                document.getElementById('hours').value = '';
                document.getElementById('minutes').value = '';
                document.getElementById('notes').value = '';
                currentRating = 0;
                updateStarDisplay('starRating', 'ratingLabel', 0);
                loadSessions();
            } else {
                showMessage(result, false);
            }
        } catch (error) {
            showMessage('Error connecting to server', false);
        }
    }

    async function openEditModal(sessionId) {
        currentEditSessionId = sessionId;

        try {
            const response = await fetch(`/session/list?userEmail=${encodeURIComponent(userEmail)}`);
            const sessions = await response.json();
            const session = sessions.find(s => s.sessionId === sessionId);

            if (session) {
                document.getElementById('editSessionName').value = session.sessionName;
                document.getElementById('editSubject').value = session.subject;

                const hours = Math.floor(session.duration / 60);
                const minutes = session.duration % 60;
                document.getElementById('editHours').value = hours;
                document.getElementById('editMinutes').value = minutes;

                currentEditRating = session.rating || 0;
                updateStarDisplay('editStarRating', 'editRatingLabel', currentEditRating);

                document.getElementById('editNotes').value = session.notes || '';
                document.getElementById('editModal').style.display = 'block';
                document.getElementById('editMessage').style.display = 'none';
            }
        } catch (error) {
            console.error('Error loading session for edit:', error);
        }
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
        currentEditSessionId = null;
        currentEditRating = 0;
    }

    async function saveEdit() {
        const sessionName = document.getElementById('editSessionName').value.trim();
        const subject = document.getElementById('editSubject').value.trim();
        const hours = parseInt(document.getElementById('editHours').value) || 0;
        const minutes = parseInt(document.getElementById('editMinutes').value) || 0;
        const notes = document.getElementById('editNotes').value.trim();

        const duration = (hours * 60) + minutes;

        if (!sessionName || !subject || duration <= 0) {
            showMessage('Please fill in all required fields', false, 'editMessage');
            return;
        }

        if (currentEditRating === 0) {
            showMessage('Please rate this session', false, 'editMessage');
            return;
        }

        try {
            const response = await fetch('/session/update', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sessionId: currentEditSessionId,
                    userEmail: userEmail,
                    sessionName: sessionName,
                    subject: subject,
                    duration: duration,
                    rating: currentEditRating,
                    notes: notes
                })
            });

            const result = await response.text();

            if (result === 'Session updated successfully') {
                showMessage(result, true, 'editMessage');
                setTimeout(() => {
                    closeEditModal();
                    loadSessions();
                }, 1000);
            } else {
                showMessage(result, false, 'editMessage');
            }
        } catch (error) {
            showMessage('Error connecting to server', false, 'editMessage');
        }
    }

    async function deleteSession(sessionId) {
        if (!confirm('Are you sure you want to delete this session? This cannot be undone.')) {
            return;
        }

        try {
            const response = await fetch(`/session/delete?userEmail=${encodeURIComponent(userEmail)}&sessionId=${sessionId}`, {
                method: 'DELETE'
            });

            const result = await response.text();

            if (result === 'Session deleted successfully') {
                loadSessions();
            } else {
                alert('Error deleting session: ' + result);
            }
        } catch (error) {
            alert('Error connecting to server');
        }
    }

    function logout() {
        sessionStorage.removeItem('userEmail');
        window.location.href = '/';
    }

    // Close modal when clicking outside of it
    window.onclick = function(event) {
        const modal = document.getElementById('editModal');
        if (event.target == modal) {
            closeEditModal();
        }
    }
</script>
</body>
</html>
